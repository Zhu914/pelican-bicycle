<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#141a2e" />
<title>鹈鹕骑士 · Pelican Rider — 实时 3D 海岸骑行</title>
<meta name="description" content="一只戴红围巾的鹈鹕骑着自行车沿海岸公路前行。全程序化建模的实时 3D 互动场景：可调速、可切换昼夜与机位。Three.js 构建，单文件、无外部依赖。" />
<meta property="og:title" content="鹈鹕骑士 · Pelican Rider" />
<meta property="og:description" content="全程序化建模的实时 3D 鹈鹕骑车场景：海岸公路、日落、车铃与嘎嘎叫。" />
<meta property="og:type" content="website" />
<style>/*__CSS__*/</style>
</head>
<body>
<noscript><p class="noscript">这个页面需要启用 JavaScript 才能渲染 3D 场景。 / This 3D scene needs JavaScript.</p></noscript>
<main id="app">
  <canvas id="scene" tabindex="0" data-i18n-aria="ariaCanvas" aria-label="三维场景：一只戴红围巾的鹈鹕骑着自行车，行驶在日落时分的海岸公路上。"></canvas>

  <div id="loader" aria-hidden="true"><div class="egg"></div><p data-i18n="loading">正在孵化鹈鹕…</p></div>

  <header id="brand" class="hud">
    <h1>鹈鹕骑士</h1>
    <p data-i18n="tagline">一只鹈鹕 · 一辆单车 · 一段海岸线</p>
  </header>

  <section id="stats" class="hud" aria-label="骑行数据">
    <div class="stat"><span class="stat-v" id="statSpeed">0</span><span class="stat-u" data-i18n="unitKmh">km/h</span><span class="stat-l" data-i18n="statsSpeed">车速</span></div>
    <div class="stat"><span class="stat-v" id="statCadence">0</span><span class="stat-u" data-i18n="unitRpm">rpm</span><span class="stat-l" data-i18n="statsCadence">踏频</span></div>
    <div class="stat"><span class="stat-v" id="statDist">0.000</span><span class="stat-u" data-i18n="unitKm">km</span><span class="stat-l" data-i18n="statsDist">里程</span></div>
    <div class="stat"><span class="stat-v" id="statFps">--</span><span class="stat-u">fps</span><span class="stat-l" id="statMeta">--</span></div>
  </section>

  <nav id="toolbar" class="hud" aria-label="快捷操作">
    <button id="bellBtn" class="tool" type="button" data-i18n-aria="bell"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" stroke="none" d="M12 3a1.5 1.5 0 0 0-1.5 1.5v.6A7 7 0 0 0 5 12v4l-2 2.5h18L19 16v-4a7 7 0 0 0-5.5-6.9v-.6A1.5 1.5 0 0 0 12 3Zm-3 17a3 3 0 0 0 6 0Z"/></svg><span data-i18n="bell">车铃</span></button>
    <button id="soundBtn" class="tool" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" stroke="none" d="M4 9v6h4l5 4V5L8 9H4Z"/><path class="ico-on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="ico-off" d="m16.5 9.5 5 5m0-5-5 5"/></svg><span data-i18n="soundOff">开启声音</span></button>
    <button id="shotBtn" class="tool" type="button" data-i18n-aria="shot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h3.3l1.5-2.3h6.4l1.5 2.3H20a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 20 19.5H4A1.5 1.5 0 0 1 2.5 18V9A1.5 1.5 0 0 1 4 7.5Z"/><circle cx="12" cy="13" r="3.6"/></svg><span data-i18n="shot">截图</span></button>
    <button id="shareBtn" class="tool" type="button" data-i18n-aria="share"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 13.5a4 4 0 0 0 5.7 0l3-3a4 4 0 1 0-5.7-5.7l-1.2 1.2"/><path d="M13.5 10.5a4 4 0 0 0-5.7 0l-3 3a4 4 0 1 0 5.7 5.7l1.2-1.2"/></svg><span data-i18n="share">分享</span></button>
    <button id="langBtn" class="tool" type="button" aria-label="Switch to English">EN</button>
    <button id="hideBtn" class="tool" type="button" data-i18n-aria="hide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg><span data-i18n="hide">隐藏界面</span></button>
  </nav>

  <button id="panelToggle" class="hud" type="button" aria-expanded="true" aria-controls="panel"><span data-i18n="controls">控制</span></button>

  <aside id="panel" class="hud" aria-label="控制面板">
    <fieldset>
      <legend data-i18n="ride">骑行</legend>
      <label class="row" for="speedRange"><span data-i18n="speed">速度</span><output id="speedVal" for="speedRange">15 km/h</output></label>
      <input id="speedRange" type="range" min="0" max="45" step="1" value="15" aria-describedby="keysHint" />
      <button id="sprintBtn" class="wide" type="button" data-i18n="sprint">冲刺 · 嘎！</button>
    </fieldset>
    <fieldset>
      <legend data-i18n="world">环境</legend>
      <label class="row" for="timeRange"><span data-i18n="time">时刻</span><output id="timeVal" for="timeRange">黄昏</output></label>
      <input id="timeRange" type="range" max="1000" min="0" step="1" value="455" />
      <div class="ticks"><span data-i18n="sunrise">日出</span><span data-i18n="noon">正午</span><span data-i18n="sunset">日落</span><span data-i18n="midnight">午夜</span></div>
      <div class="chips">
        <label class="switch"><input id="autoTime" type="checkbox" /><span data-i18n="autoTime">自动昼夜</span></label>
        <button id="nightBtn" class="chip" type="button" data-i18n="night">切到夜晚</button>
      </div>
    </fieldset>
    <fieldset>
      <legend data-i18n="camera">视角</legend>
      <div class="grid" id="camGrid">
        <button class="chip cam is-on" type="button" data-cam="hero" data-i18n="camHero">英雄</button>
        <button class="chip cam" type="button" data-cam="side" data-i18n="camSide">侧面</button>
        <button class="chip cam" type="button" data-cam="front" data-i18n="camFront">正面</button>
        <button class="chip cam" type="button" data-cam="chase" data-i18n="camChase">追随</button>
        <button class="chip cam" type="button" data-cam="face" data-i18n="camFace">特写</button>
        <button class="chip cam" type="button" data-cam="detail" data-i18n="camDetail">机械</button>
        <button class="chip cam" type="button" data-cam="top" data-i18n="camTop">俯瞰</button>
        <button class="chip cam" type="button" data-cam="wide" data-i18n="camWide">全景</button>
      </div>
      <label class="switch"><input id="autoRotChk" type="checkbox" checked /><span data-i18n="autoRotate">自动环绕</span></label>
      <label class="switch"><input id="cineChk" type="checkbox" /><span data-i18n="cinematic">电影机位</span></label>
    </fieldset>
    <fieldset>
      <legend data-i18n="paint">涂装</legend>
      <div class="swatches" id="swatches" role="group" aria-label="车架颜色"></div>
    </fieldset>
    <fieldset>
      <legend data-i18n="fx">效果</legend>
      <label class="switch"><input id="bloomChk" type="checkbox" checked /><span data-i18n="bloom">泛光</span></label>
      <label class="switch"><input id="wireChk" type="checkbox" /><span data-i18n="wire">线框</span></label>
      <label class="switch"><input id="slowChk" type="checkbox" /><span data-i18n="slow">慢动作</span></label>
    </fieldset>
  </aside>

  <p id="keys" class="hud" data-i18n="keysHint">拖拽旋转 · 滚轮缩放 · ↑↓ 调速 · Space 冲刺 · B 车铃 · N 昼夜 · C 视角 · P 暂停 · H 隐藏界面 · 点击鹈鹕或车铃有惊喜</p>
  <div id="toast" role="status" aria-live="polite"></div>

  <div id="fallback" class="hud" hidden>
    <h2 data-i18n="fallbackTitle">无法启动 3D 场景</h2>
    <p data-i18n="fallbackBody">当前浏览器不支持 WebGL2。请使用最新版 Chrome、Edge、Safari 或 Firefox 打开。</p>
  </div>
</main>
<script>/*__JS__*/</script>
</body>
</html>
