<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#141a2e" />
<title>鹈鹕骑士 · Pelican Rider — 实时 3D 海岸骑行</title>
<meta name="description" content="一只戴红围巾的鹈鹕骑着自行车沿海岸公路前行。全程序化建模的实时 3D 互动场景：可调速、可切换昼夜与机位。Three.js 构建，单文件、无外部依赖。" />
<meta property="og:title" content="鹈鹕骑士 · Pelican Rider" />
<meta property="og:description" content="全程序化建模的实时 3D 鹈鹕骑车场景：海岸公路、日落、车铃与嘎嘎叫。" />
<meta property="og:type" content="website" />
<style>:root {
  --ink: #f7f2e8;
  --muted: rgba(247, 242, 232, 0.66);
  --panel: rgba(17, 19, 32, 0.66);
  --panel-strong: rgba(17, 19, 32, 0.84);
  --line: rgba(255, 255, 255, 0.12);
  --accent: #ffb15c;
  --accent-ink: #2a1a0a;
  --radius: 14px;
  --radius-sm: 9px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", Roboto, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #141a2e;
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

.noscript { padding: 24px; }

#scene {
  position: fixed;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  outline: none;
  cursor: grab;
}
#scene.is-dragging { cursor: grabbing; }
#scene.is-hot { cursor: pointer; }

.hud {
  position: fixed;
  z-index: 2;
  transition: opacity 0.35s ease, transform 0.35s ease;
}
body.ui-hidden .hud:not(#toast) {
  opacity: 0;
  pointer-events: none;
}

/* ---------- loader ---------- */
#loader {
  position: fixed;
  inset: 0;
  z-index: 6;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 14px;
  background: radial-gradient(circle at 60% 45%, #3a2f58 0%, #1b2038 55%, #0e1222 100%);
  color: var(--ink);
  transition: opacity 0.9s ease;
}
body.ready #loader { opacity: 0; pointer-events: none; }
.egg {
  width: 34px;
  height: 44px;
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  background: #fbf5e6;
  box-shadow: 0 0 24px rgba(255, 190, 120, 0.55);
  animation: wobble 1.1s ease-in-out infinite;
}
@keyframes wobble {
  0%, 100% { transform: rotate(-8deg) translateY(0); }
  50% { transform: rotate(8deg) translateY(-6px); }
}

/* ---------- brand ---------- */
#brand {
  top: 18px;
  left: calc(18px + var(--safe-l));
  pointer-events: none;
  text-shadow: 0 1px 12px rgba(10, 8, 20, 0.55);
}
#brand h1 {
  margin: 0;
  font-size: 30px;
  font-weight: 700;
  letter-spacing: 0.08em;
  line-height: 1.15;
}
#brand p {
  margin: 4px 0 0;
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.06em;
}
html[lang="en"] #brand h1 { letter-spacing: 0.01em; font-size: 28px; }

/* ---------- shared controls ---------- */
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}
button:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.chip, .tool {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 30px;
  padding: 4px 11px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.06);
  color: var(--ink);
  white-space: nowrap;
  transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
}
.chip:hover, .tool:hover { background: rgba(255, 255, 255, 0.14); border-color: rgba(255, 255, 255, 0.3); }
.chip.is-on, .chip[aria-pressed="true"], .tool[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.wide {
  width: 100%;
  min-height: 34px;
  border: 0;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, #ff8a4c, #e2542f);
  color: #fff8ef;
  font-weight: 600;
  letter-spacing: 0.04em;
  box-shadow: 0 6px 18px rgba(226, 84, 47, 0.32);
  transition: transform 0.15s ease, filter 0.15s ease;
}
.wide:hover { filter: brightness(1.08); }
.wide:active { transform: scale(0.98); }

.switch {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 28px;
  cursor: pointer;
  user-select: none;
}
.switch input {
  appearance: none;
  width: 32px;
  height: 18px;
  margin: 0;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.18);
  position: relative;
  cursor: pointer;
  transition: background 0.2s ease;
  flex: none;
}
.switch input::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.2s ease;
}
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(14px); background: var(--accent-ink); }

input[type="range"] {
  appearance: none;
  width: 100%;
  height: 22px;
  margin: 2px 0 4px;
  background: transparent;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.22);
}
input[type="range"]::-moz-range-track {
  height: 4px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.22);
}
input[type="range"]::-webkit-slider-thumb {
  appearance: none;
  width: 16px;
  height: 16px;
  margin-top: -6px;
  border-radius: 50%;
  background: var(--accent);
  border: 0;
  box-shadow: 0 0 0 3px rgba(255, 177, 92, 0.22);
}
input[type="range"]::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--accent);
  border: 0;
}

/* ---------- stats ---------- */
#stats {
  top: 18px;
  right: calc(18px + var(--safe-r));
  display: grid;
  grid-template-columns: repeat(4, auto);
  gap: 1px;
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--line);
  box-shadow: 0 8px 30px rgba(8, 8, 18, 0.28);
}
.stat {
  display: grid;
  padding: 7px 13px 8px;
  background: var(--panel);
  min-width: 76px;
}
.stat-v {
  grid-row: 1;
  grid-column: 1;
  font-size: 19px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}
.stat-u { grid-row: 1; grid-column: 2; align-self: end; padding-left: 4px; padding-bottom: 2px; font-size: 11px; color: var(--muted); }
.stat-l { grid-row: 2; grid-column: 1 / span 2; font-size: 11px; color: var(--muted); }

/* ---------- toolbar ---------- */
#toolbar {
  top: 84px;
  right: calc(18px + var(--safe-r));
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
}
.tool {
  background: var(--panel);
  box-shadow: 0 6px 20px rgba(8, 8, 18, 0.24);
}
.tool svg {
  width: 15px;
  height: 15px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}
.tool .ico-on { display: none; }
#soundBtn[aria-pressed="true"] .ico-on { display: inline; }
#soundBtn[aria-pressed="true"] .ico-off { display: none; }
#soundBtn[aria-pressed="false"] .ico-on { display: none; }
#soundBtn[aria-pressed="false"] .ico-off { display: inline; }

/* ---------- panel ---------- */
#panel {
  left: calc(18px + var(--safe-l));
  bottom: calc(18px + var(--safe-b));
  width: 448px;
  max-width: calc(100vw - 36px);
  max-height: calc(100vh - 190px);
  overflow-y: auto;
  overscroll-behavior: contain;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 10px;
  border-radius: var(--radius);
  background: var(--panel);
  box-shadow: 0 12px 40px rgba(8, 8, 18, 0.32);
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
}
#panel fieldset {
  margin: 0;
  padding: 7px 10px 9px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  min-width: 0;
}
#panel fieldset:nth-child(3) { grid-column: 1 / -1; }
#panel legend {
  padding: 0 6px;
  font-size: 12px;
  letter-spacing: 0.12em;
  color: var(--accent);
}
.row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}
.row output {
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}
.ticks {
  display: flex;
  justify-content: space-between;
  margin: -4px 3px 6px;
  font-size: 11px;
  color: var(--muted);
}
.chips {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 4px;
  margin-bottom: 6px;
}
.grid .chip {
  padding: 4px 2px;
  min-height: 28px;
  font-size: 12px;
}
.swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.swatch {
  width: 26px;
  height: 26px;
  padding: 0;
  border: 2px solid rgba(255, 255, 255, 0.28);
  border-radius: 50%;
  background: var(--c);
  transition: transform 0.15s ease, border-color 0.15s ease;
}
.swatch:hover { transform: scale(1.12); }
.swatch.is-on, .swatch[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.28); }
#panelToggle { display: none; }

/* ---------- hints & toast ---------- */
#keys {
  right: calc(18px + var(--safe-r));
  bottom: calc(18px + var(--safe-b));
  max-width: min(520px, 52vw);
  margin: 0;
  font-size: 12px;
  text-align: right;
  color: var(--muted);
  text-shadow: 0 1px 8px rgba(10, 8, 20, 0.7);
  pointer-events: none;
}
kbd, #keys { font-variant-numeric: tabular-nums; }
#toast {
  position: fixed;
  left: 50%;
  top: 20px;
  z-index: 5;
  transform: translate(-50%, -14px);
  padding: 8px 18px;
  border-radius: 999px;
  background: var(--panel-strong);
  border: 1px solid var(--line);
  font-weight: 600;
  letter-spacing: 0.04em;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
#toast.is-on { opacity: 1; transform: translate(-50%, 0); }

#fallback {
  inset: 0;
  z-index: 8;
  display: grid;
  place-content: center;
  justify-items: center;
  padding: 24px;
  text-align: center;
  background: #1b2038;
}
#fallback[hidden] { display: none; }
#fallback h2 { margin: 0 0 8px; font-size: 22px; }
#fallback p { margin: 0; color: var(--muted); max-width: 420px; }

/* ---------- compact layout: phones, portrait tablets, landscape phones ---------- */
@media (max-width: 720px), (orientation: portrait) and (max-width: 1024px), (max-height: 480px) {
  :root { --radius: 12px; }
}

/* ---------- narrower desktop windows ---------- */
@media (max-width: 980px) {
  #keys { display: none; }
  #panel { width: 420px; }
}
@media (max-width: 720px), (orientation: portrait) and (max-width: 1024px), (max-height: 480px) {
  #brand { top: 12px; left: calc(12px + var(--safe-l)); }
  #brand h1 { font-size: 22px; }
  #brand p { display: none; }
  #stats {
    top: 12px;
    right: calc(12px + var(--safe-r));
    grid-template-columns: repeat(2, auto);
  }
  .stat { min-width: 0; padding: 5px 10px 6px; }
  .stat-v { font-size: 15px; }
  #toolbar {
    top: auto;
    right: calc(12px + var(--safe-r));
    bottom: calc(12px + var(--safe-b));
    flex-direction: row;
    flex-wrap: nowrap;
    justify-content: flex-end;
    gap: 5px;
    max-width: calc(100vw - 124px);
  }
  .tool span { display: none; }
  .tool { min-width: 38px; min-height: 38px; padding: 8px; }
  .tool svg { width: 18px; height: 18px; }
  #langBtn span { display: inline; font-size: 12px; font-weight: 600; }
  #panelToggle {
    display: block;
    left: calc(12px + var(--safe-l));
    bottom: calc(12px + var(--safe-b));
    min-height: 40px;
    padding: 0 18px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel-strong);
    font-weight: 600;
  }
  #panel {
    left: calc(12px + var(--safe-l));
    right: calc(12px + var(--safe-r));
    bottom: calc(60px + var(--safe-b));
    width: auto;
    max-width: none;
    max-height: calc(100vh - 176px - var(--safe-b));
    grid-template-columns: 1fr;
    transform-origin: left bottom;
  }
  #panel { background: var(--panel-strong); }
  #panel fieldset:nth-child(3) { grid-column: auto; }
  .grid { grid-template-columns: repeat(4, 1fr); }
  #panel.is-closed {
    opacity: 0;
    transform: translateY(10px) scale(0.98);
    pointer-events: none;
  }
}
@media (max-width: 420px) {
  .stat-l { display: none; }
}
@media (max-width: 360px) {
  .tool { min-width: 32px; min-height: 32px; padding: 6px; }
  #toolbar { gap: 4px; max-width: calc(100vw - 104px); }
  #panelToggle { padding: 0 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .hud, #loader, #toast, .wide, .swatch { transition-duration: 0.01ms; }
  .egg { animation: none; }
}</style>
</head>
<body>
<noscript><p class="noscript">这个页面需要启用 JavaScript 才能渲染 3D 场景。 / This 3D scene needs JavaScript.</p></noscript>
<main id="app">
  <canvas id="scene" tabindex="0" data-i18n-aria="ariaCanvas" aria-label="三维场景：一只戴红围巾的鹈鹕骑着自行车，行驶在日落时分的海岸公路上。"></canvas>

  <div id="loader" aria-hidden="true"><div class="egg"></div><p data-i18n="loading">正在孵化鹈鹕…</p></div>

  <header id="brand" class="hud">
    <h1>鹈鹕骑士</h1>
    <p data-i18n="tagline">一只鹈鹕 · 一辆单车 · 一段海岸线</p>
  </header>

  <section id="stats" class="hud" aria-label="骑行数据">
    <div class="stat"><span class="stat-v" id="statSpeed">0</span><span class="stat-u" data-i18n="unitKmh">km/h</span><span class="stat-l" data-i18n="statsSpeed">车速</span></div>
    <div class="stat"><span class="stat-v" id="statCadence">0</span><span class="stat-u" data-i18n="unitRpm">rpm</span><span class="stat-l" data-i18n="statsCadence">踏频</span></div>
    <div class="stat"><span class="stat-v" id="statDist">0.000</span><span class="stat-u" data-i18n="unitKm">km</span><span class="stat-l" data-i18n="statsDist">里程</span></div>
    <div class="stat"><span class="stat-v" id="statFps">--</span><span class="stat-u">fps</span><span class="stat-l" id="statMeta">--</span></div>
  </section>

  <nav id="toolbar" class="hud" aria-label="快捷操作">
    <button id="bellBtn" class="tool" type="button" data-i18n-aria="bell"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" stroke="none" d="M12 3a1.5 1.5 0 0 0-1.5 1.5v.6A7 7 0 0 0 5 12v4l-2 2.5h18L19 16v-4a7 7 0 0 0-5.5-6.9v-.6A1.5 1.5 0 0 0 12 3Zm-3 17a3 3 0 0 0 6 0Z"/></svg><span data-i18n="bell">车铃</span></button>
    <button id="soundBtn" class="tool" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" stroke="none" d="M4 9v6h4l5 4V5L8 9H4Z"/><path class="ico-on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="ico-off" d="m16.5 9.5 5 5m0-5-5 5"/></svg><span data-i18n="soundOff">开启声音</span></button>
    <button id="shotBtn" class="tool" type="button" data-i18n-aria="shot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h3.3l1.5-2.3h6.4l1.5 2.3H20a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 20 19.5H4A1.5 1.5 0 0 1 2.5 18V9A1.5 1.5 0 0 1 4 7.5Z"/><circle cx="12" cy="13" r="3.6"/></svg><span data-i18n="shot">截图</span></button>
    <button id="shareBtn" class="tool" type="button" data-i18n-aria="share"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 13.5a4 4 0 0 0 5.7 0l3-3a4 4 0 1 0-5.7-5.7l-1.2 1.2"/><path d="M13.5 10.5a4 4 0 0 0-5.7 0l-3 3a4 4 0 1 0 5.7 5.7l1.2-1.2"/></svg><span data-i18n="share">分享</span></button>
    <button id="langBtn" class="tool" type="button" aria-label="Switch to English">EN</button>
    <button id="hideBtn" class="tool" type="button" data-i18n-aria="hide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg><span data-i18n="hide">隐藏界面</span></button>
  </nav>

  <button id="panelToggle" class="hud" type="button" aria-expanded="true" aria-controls="panel"><span data-i18n="controls">控制</span></button>

  <aside id="panel" class="hud" aria-label="控制面板">
    <fieldset>
      <legend data-i18n="ride">骑行</legend>
      <label class="row" for="speedRange"><span data-i18n="speed">速度</span><output id="speedVal" for="speedRange">15 km/h</output></label>
      <input id="speedRange" type="range" min="0" max="45" step="1" value="15" aria-describedby="keysHint" />
      <button id="sprintBtn" class="wide" type="button" data-i18n="sprint">冲刺 · 嘎！</button>
    </fieldset>
    <fieldset>
      <legend data-i18n="world">环境</legend>
      <label class="row" for="timeRange"><span data-i18n="time">时刻</span><output id="timeVal" for="timeRange">黄昏</output></label>
      <input id="timeRange" type="range" max="1000" min="0" step="1" value="455" />
      <div class="ticks"><span data-i18n="sunrise">日出</span><span data-i18n="noon">正午</span><span data-i18n="sunset">日落</span><span data-i18n="midnight">午夜</span></div>
      <div class="chips">
        <label class="switch"><input id="autoTime" type="checkbox" /><span data-i18n="autoTime">自动昼夜</span></label>
        <button id="nightBtn" class="chip" type="button" data-i18n="night">切到夜晚</button>
      </div>
    </fieldset>
    <fieldset>
      <legend data-i18n="camera">视角</legend>
      <div class="grid" id="camGrid">
        <button class="chip cam is-on" type="button" data-cam="hero" data-i18n="camHero">英雄</button>
        <button class="chip cam" type="button" data-cam="side" data-i18n="camSide">侧面</button>
        <button class="chip cam" type="button" data-cam="front" data-i18n="camFront">正面</button>
        <button class="chip cam" type="button" data-cam="chase" data-i18n="camChase">追随</button>
        <button class="chip cam" type="button" data-cam="face" data-i18n="camFace">特写</button>
        <button class="chip cam" type="button" data-cam="detail" data-i18n="camDetail">机械</button>
        <button class="chip cam" type="button" data-cam="top" data-i18n="camTop">俯瞰</button>
        <button class="chip cam" type="button" data-cam="wide" data-i18n="camWide">全景</button>
      </div>
      <label class="switch"><input id="autoRotChk" type="checkbox" checked /><span data-i18n="autoRotate">自动环绕</span></label>
      <label class="switch"><input id="cineChk" type="checkbox" /><span data-i18n="cinematic">电影机位</span></label>
    </fieldset>
    <fieldset>
      <legend data-i18n="paint">涂装</legend>
      <div class="swatches" id="swatches" role="group" aria-label="车架颜色"></div>
    </fieldset>
    <fieldset>
      <legend data-i18n="fx">效果</legend>
      <label class="switch"><input id="bloomChk" type="checkbox" checked /><span data-i18n="bloom">泛光</span></label>
      <label class="switch"><input id="wireChk" type="checkbox" /><span data-i18n="wire">线框</span></label>
      <label class="switch"><input id="slowChk" type="checkbox" /><span data-i18n="slow">慢动作</span></label>
